<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>beb: nothing at this address</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --ink: #33291c; --paper: #e9dcc4; --desk: #d8cdb8; --rule: #c8b999; --faint: #8a7a5c; --muted: #6a5c42; --red: #b3372c; --blue: #3a5486; --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
body { margin: 0; background: var(--desk); font-family: 'Spectral', Georgia, serif; padding: 48px 24px; }
a { color: var(--red); text-decoration: none; }
a:hover { color: #8c2a21; text-decoration: underline; }

.sheet { position: relative; max-width: 880px; margin: 0 auto; }
.tape { height: 10px; background: repeating-linear-gradient(45deg, var(--red) 0 16px, var(--paper) 16px 32px, var(--blue) 32px 48px, var(--paper) 48px 64px); }
.wordmark { display: flex; align-items: baseline; font-family: var(--mono); font-size: 96px; font-weight: 700; letter-spacing: -4px; color: var(--ink); line-height: 1; margin: 0; }
.wordmark .o { width: 53px; height: 53px; border-radius: 50%; background: var(--red); color: var(--paper); display: grid; place-items: center; font-size: 42px; letter-spacing: 0; align-self: flex-end; margin: 0 3px 11px 6px; padding: 0 0 7px 2px; }
.row { display: grid; grid-template-columns: 150px minmax(0, 1fr); border-bottom: 1px solid var(--rule); }
.label { padding: 32px 0 32px 56px; font-family: var(--mono); font-size: 12px; letter-spacing: 2px; color: var(--faint); }
.install { margin: 0; padding: 32px 56px 32px 0; font-family: var(--mono); font-size: 14px; line-height: 2.1; overflow-x: auto; }

@media (max-width: 720px) {
  body { padding: 20px 12px; }
  .row { grid-template-columns: minmax(0, 1fr); }
  .label { padding: 24px 24px 4px; }
  .row > :last-child { padding: 10px 24px 28px !important; }
  .masthead { padding: 40px 24px 32px !important; }
  .wordmark { font-size: 64px; }
  .wordmark .o { width: 36px; height: 36px; font-size: 28px; margin: 0 2px 7px 4px; padding: 0 0 5px 1px; }
  .tagline { font-size: 22px !important; }
  header.bar, footer.bar { padding-left: 24px !important; padding-right: 24px !important; }
  .install { font-size: 12px !important; line-height: 2.4 !important; }
  .install .note { display: none; }
}
</style>
</head>
<body>

<main class="sheet">
  <div style="background: var(--paper); color: var(--ink); box-shadow: 0 2px 24px rgba(42,37,30,0.25);">
    <div class="tape"></div>

    <header class="bar" style="display: flex; align-items: baseline; justify-content: flex-end; padding: 22px 56px; gap: 16px; flex-wrap: wrap;">
      <nav style="display: flex; gap: 24px; font-family: var(--mono); font-size: 13px; flex-wrap: wrap;">
        <a href="/" style="color: var(--ink);">getbeb.dev</a>
        <a href="https://github.com/getbeb/beb" style="color: var(--ink);">beb</a>
        <a href="https://github.com/getbeb/beb-courier" style="color: var(--ink);">beb-courier</a>
        <a href="https://github.com/getbeb/beb-depot" style="color: var(--ink);">beb-depot</a>
      </nav>
    </header>

    <div class="masthead" style="padding: 64px 56px 48px; border-bottom: 1px solid var(--rule);">
      <h1 class="wordmark"><span>b</span><span class="o">e</span><span>b</span></h1>
      <p class="tagline" style="font-size: 30px; font-style: italic; margin: 10px 0 0; max-width: 560px; line-height: 1.35;">Nothing at this address.</p>
    </div>

    <div class="row" style="border-bottom: 0;">
      <div class="label">INSTALL</div>
      <pre class="install">curl -fsSL https://getbeb.dev/install.sh | sh   <span class="note" style="color: var(--faint);"># beb</span>
curl -fsSL https://getbeb.dev/courier.sh | sh   <span class="note" style="color: var(--faint);"># beb-courier</span>
curl -fsSL https://getbeb.dev/depot.sh | sh     <span class="note" style="color: var(--faint);"># beb-depot</span></pre>
    </div>

    <div class="tape"></div>
    <footer class="bar" style="display: flex; justify-content: space-between; padding: 18px 56px; font-family: var(--mono); font-size: 12.5px; color: var(--faint);">
      <div>MIT</div>
      <div><a href="https://github.com/getbeb">github.com/getbeb</a></div>
    </footer>
  </div>
</main>

</body>
</html>
