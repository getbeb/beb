name: site

# getbeb.dev is this repo's gh-pages branch, published from site/ here
# plus one installer from each repo in the family:
#
#   getbeb.dev/install.sh   beb
#   getbeb.dev/courier.sh   beb-courier
#   getbeb.dev/depot.sh     beb-depot
#
# The page used to live only on gh-pages, which is how it came to
# advertise a program that no longer exists. It lives in main now, so it
# changes in the same commit as the thing it describes.

on:
  push:
    branches: [main]
    paths: [install.sh, "site/**", ".github/workflows/site.yml"]
  # The sibling installers live in other repos, so their changes cannot
  # trigger this.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      # Absent or private: publish what we have rather than failing, so
      # continue-on-error belongs to the step and not to checkout's inputs.
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: getbeb/beb-depot
          path: depot
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: getbeb/beb-courier
          path: courier
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - run: |
          cp -r main/site/. pages/
          cp main/install.sh pages/install.sh
          # Not "[ -f x ] && cp": a false test would end the step, since
          # Actions runs this under bash -e.
          if [ -f depot/install.sh ]; then cp depot/install.sh pages/depot.sh; fi
          if [ -f courier/install.sh ]; then cp courier/install.sh pages/courier.sh; fi
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "sync site and installers"; git push; }
